<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Return By Death — Bleach vs Naruto Mobile</title>
    <meta name="description" content="Kỷ nguyên đối kháng trực tuyến Anime huyền thoại tái sinh trên di động với cơ chế P2P Netplay đồng bộ mượt mà.">
    <meta property="og:title" content="Return By Death — Bleach vs Naruto Mobile">
    <meta property="og:description" content="Kỷ nguyên đối kháng trực tuyến Anime huyền thoại tái sinh trên di động.">
    <meta property="og:type" content="website">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: #0a0a0f;
            color: #fff;
            overflow-x: hidden;
        }

        /* ═══ VIDEO HERO SECTION ═══ */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;
        }

        .hero video {
            position: absolute;
            top: 50%;
            left: 50%;
            min-width: 100%;
            min-height: 100%;
            width: auto;
            height: auto;
            transform: translate(-50%, -50%);
            object-fit: cover;
            z-index: 0;
        }

        /* Dark gradient overlay so text is readable */
        .hero-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(0,0,0,0.3) 0%,
                rgba(0,0,0,0.1) 40%,
                rgba(0,0,0,0.5) 70%,
                rgba(10,10,15,0.95) 100%
            );
            z-index: 1;
        }

        /* Side manga art overlay (optional — decorative) */
        .hero-side-left, .hero-side-right {
            position: absolute;
            top: 0;
            bottom: 0;
            width: 15%;
            z-index: 1;
            pointer-events: none;
        }
        .hero-side-left {
            left: 0;
            background: linear-gradient(to right, rgba(10,10,15,0.8), transparent);
        }
        .hero-side-right {
            right: 0;
            background: linear-gradient(to left, rgba(10,10,15,0.8), transparent);
        }

        /* Content on top of video */
        .hero-content {
            position: absolute;
            bottom: 60px;
            left: 40px;
            z-index: 2;
            max-width: 600px;
        }

        .hero-logo {
            font-family: 'Orbitron', monospace;
            font-weight: 900;
            font-size: clamp(2rem, 5vw, 3.5rem);
            line-height: 1.1;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        .hero-logo .death {
            color: #ff2244;
            text-shadow: 0 0 20px rgba(255,34,68,0.6);
        }

        .hero-desc {
            font-size: clamp(0.85rem, 1.5vw, 1rem);
            color: rgba(255,255,255,0.75);
            line-height: 1.6;
            margin-bottom: 24px;
            max-width: 500px;
        }

        /* Download buttons */
        .hero-buttons {
            position: absolute;
            top: 24px;
            right: 30px;
            z-index: 3;
            display: flex;
            gap: 12px;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 10px 22px;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-weight: 700;
            font-size: 0.85rem;
            text-decoration: none;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            transition: all 0.2s ease;
            border: none;
            cursor: pointer;
        }

        .btn-android {
            background: #1a1a2e;
            color: #4fc3f7;
            border: 1px solid rgba(79,195,247,0.3);
        }
        .btn-android:hover {
            background: #4fc3f7;
            color: #0a0a0f;
            box-shadow: 0 0 20px rgba(79,195,247,0.4);
        }

        .btn-ios {
            background: linear-gradient(135deg, #ff6b35, #ff2244);
            color: #fff;
        }
        .btn-ios:hover {
            box-shadow: 0 0 20px rgba(255,34,68,0.5);
            transform: translateY(-1px);
        }

        /* Video playback controls (minimal) */
        .video-controls {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 3;
            display: flex;
            gap: 8px;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .video-controls:hover {
            opacity: 1;
        }
        .video-controls button {
            background: rgba(255,255,255,0.15);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 14px;
            backdrop-filter: blur(8px);
            transition: background 0.2s;
        }
        .video-controls button:hover {
            background: rgba(255,255,255,0.3);
        }

        /* ═══ RESPONSIVE ═══ */
        @media (max-width: 768px) {
            .hero-content {
                left: 20px;
                right: 20px;
                bottom: 80px;
            }
            .hero-buttons {
                top: 16px;
                right: 16px;
                flex-direction: column;
                gap: 8px;
            }
            .btn {
                padding: 8px 16px;
                font-size: 0.75rem;
            }
            .hero-side-left, .hero-side-right {
                display: none;
            }
        }
    </style>
</head>
<body>
    <section class="hero">
        <!-- Background Video — muted for autoplay, loops -->
        <video autoplay muted loop playsinline id="heroVideo">
            <source src="intro.mp4" type="video/mp4">
        </video>

        <!-- Overlays -->
        <div class="hero-overlay"></div>
        <div class="hero-side-left"></div>
        <div class="hero-side-right"></div>

        <!-- Download Buttons (top-right) -->
        <div class="hero-buttons">
            <a href="https://github.com/oneliveonelove/rbyd-website/releases/download/v1.4.1/ReturnByDeath.apk" class="btn btn-android">
                📱 Tải Android
            </a>
            <a href="https://github.com/oneliveonelove/rbyd-ios/releases" class="btn btn-ios">
                🍎 Tải iOS · Sideload
            </a>
        </div>

        <!-- Title & Description (bottom-left) -->
        <div class="hero-content">
            <h1 class="hero-logo">
                RETURN BY <span class="death">DEATH</span>
            </h1>
            <p class="hero-desc">
                Kỷ nguyên đối kháng trực tuyến Anime huyền thoại tái sinh trên di động
                với cơ chế P2P Netplay đồng bộ mượt mà.
            </p>
        </div>

        <!-- Minimal Play/Pause Controls -->
        <div class="video-controls">
            <button onclick="togglePlay()" id="playBtn" title="Play/Pause">⏸</button>
            <button onclick="toggleMute()" id="muteBtn" title="Mute/Unmute">🔇</button>
        </div>
    </section>

    <script>
        const video = document.getElementById('heroVideo');
        const playBtn = document.getElementById('playBtn');
        const muteBtn = document.getElementById('muteBtn');

        function togglePlay() {
            if (video.paused) {
                video.play();
                playBtn.textContent = '⏸';
            } else {
                video.pause();
                playBtn.textContent = '▶';
            }
        }

        function toggleMute() {
            video.muted = !video.muted;
            muteBtn.textContent = video.muted ? '🔇' : '🔊';
        }
    </script>
</body>
</html>
